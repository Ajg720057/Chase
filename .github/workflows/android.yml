name: Build Baby Layers Android app

on:
  push:
    branches: [claude/baby-clothing-layer-app-szzrzu]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BabyLayers.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BabyLayers-apk
          path: android/BabyLayers.apk

      - name: Publish to the "baby-layers-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete baby-layers-latest --yes --cleanup-tag || true
          gh release create baby-layers-latest BabyLayers.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Baby Layers (latest build)" \
            --notes "Download BabyLayers.apk on your Android phone and open it to install. Built from ${{ github.sha }}."
