<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Draftroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: an app shell. Section rail on the left, the working surface in the middle
   (a real 8.5" script page in the editor), and a collapsible assistant on the right. */
:root {
  --bg: #eceef2;
  --surface: #ffffff;
  --surface-2: #f4f5f8;
  --ink: #171b24;
  --muted: #5a6373;
  --line: #d3d7df;
  --accent: #2344d2;
  --accent-ink: #ffffff;
  --accent-soft: #e2e7fc;
  --hl: #ffe06a;
  --hl-soft: rgba(255, 224, 106, 0.45);
  --paper: #ffffff;
  --paper-ink: #121212;
  --ok: #1d7f46;
  --warn: #9a5c00;
  --crit: #bf3328;
  --shadow: 0 1px 2px rgba(20, 26, 40, 0.06), 0 6px 24px rgba(20, 26, 40, 0.07);

  --f-ui: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-script: "Courier Prime", "Courier New", Courier, monospace;

  --r: 6px;
  --rail: 196px;
  --drawer: 380px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1217; --surface: #171b22; --surface-2: #1e232c; --ink: #e6e8ed; --muted: #9aa2b1;
    --line: #2a303b; --accent: #8199ff; --accent-ink: #0b0e14; --accent-soft: #222b4b;
    --hl: #e5c446; --hl-soft: rgba(229, 196, 70, 0.22); --paper: #1b1f27; --paper-ink: #e8e7e3;
    --ok: #4cc27f; --warn: #e2a53c; --crit: #f06e62;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 24px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1217; --surface: #171b22; --surface-2: #1e232c; --ink: #e6e8ed; --muted: #9aa2b1;
  --line: #2a303b; --accent: #8199ff; --accent-ink: #0b0e14; --accent-soft: #222b4b;
  --hl: #e5c446; --hl-soft: rgba(229, 196, 70, 0.22); --paper: #1b1f27; --paper-ink: #e8e7e3;
  --ok: #4cc27f; --warn: #e2a53c; --crit: #f06e62;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 24px rgba(0, 0, 0, 0.35);
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-ui); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- shell ---------- */
#app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
.topbar {
  display: flex; align-items: center; gap: 12px; padding: 10px 16px;
  background: var(--surface); border-bottom: 1px solid var(--line); min-width: 0;
}
.brand { font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: 0.02em; text-transform: uppercase; }
.brand small { font-family: var(--f-ui); font-weight: 500; font-size: 11px; letter-spacing: 0.08em; color: var(--muted); margin-left: 6px; }
.proj-title { min-width: 0; flex: 1; display: flex; align-items: center; gap: 10px; }
.proj-title strong { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.save-state { font-size: 12px; color: var(--muted); white-space: nowrap; }
.save-state.err { color: var(--crit); }
.topbar .actions { display: flex; gap: 6px; align-items: center; }

.body { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr) auto; min-height: 0; }
.rail { border-right: 1px solid var(--line); background: var(--surface); padding: 14px 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.rail a {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: var(--r); color: var(--ink); text-decoration: none; font-weight: 500;
}
.rail a:hover { background: var(--surface-2); }
.rail a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.rail .meter { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rail .sep { height: 1px; background: var(--line); margin: 10px 6px; }
.rail .hint { font-size: 12px; color: var(--muted); padding: 4px 10px; line-height: 1.45; }

main { overflow: auto; min-width: 0; }
.view { padding: 24px 16px 64px; max-width: 1080px; margin: 0 auto; }
.view.wide { max-width: none; }

/* ---------- type & controls ---------- */
h1, h2, h3 { text-wrap: balance; margin: 0; }
.eyebrow { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); }
.vtitle { font-family: var(--f-display); font-weight: 800; font-size: clamp(30px, 4vw, 42px); line-height: 1; text-transform: uppercase; letter-spacing: 0.01em; }
.lede { color: var(--muted); max-width: 62ch; margin: 8px 0 0; }
h2.sec { font-size: 17px; font-weight: 600; margin: 0 0 4px; }
.sub { color: var(--muted); font-size: 13.5px; margin: 0 0 12px; max-width: 65ch; }

.btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface);
  padding: 6px 12px; border-radius: var(--r); cursor: pointer; font-size: 13.5px; font-weight: 500; white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.small { padding: 3px 8px; font-size: 12.5px; }
.btn.danger { color: var(--crit); }
.btn[disabled] { opacity: 0.5; cursor: default; }

label.f { display: grid; gap: 4px; }
label.f > span { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
label.f > span em { font-style: normal; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--muted); margin-left: 6px; }
input[type="text"], input[type="number"], select, textarea {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r);
  padding: 8px 10px; line-height: 1.45;
}
textarea { resize: vertical; min-height: 64px; field-sizing: content; max-height: 60vh; }
textarea.short { min-height: 42px; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
::placeholder { color: var(--muted); opacity: 0.7; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.stack { display: grid; gap: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 18px 0 18px; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 8px 12px; cursor: pointer; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.pill { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); } .pill.crit { color: var(--crit); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
.hdr { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; background: var(--hl-soft); border: 1px solid var(--hl); padding: 10px 14px; border-radius: 8px; margin-bottom: 18px; font-size: 14px; }

/* ---------- home ---------- */
.logline-card { font-family: var(--f-script); font-size: 17px; line-height: 1.55; padding: 22px 24px; border-left: 4px solid var(--hl); background: var(--surface); border-radius: 0 10px 10px 0; box-shadow: var(--shadow); }
.logline-card.empty { color: var(--muted); font-family: var(--f-ui); font-size: 15px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.stat b { display: block; font-family: var(--f-display); font-size: 30px; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.next { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.next h3 { font-size: 16px; }
.timeline { position: relative; height: 70px; margin: 8px 6px 0; }
.timeline .bar { position: absolute; left: 0; right: 0; top: 30px; height: 8px; background: var(--surface-2); border-radius: 4px; border: 1px solid var(--line); }
.timeline .fill { position: absolute; left: 0; top: 30px; height: 8px; background: var(--accent); border-radius: 4px; }
.timeline .tick { position: absolute; top: 22px; width: 1px; height: 24px; background: var(--muted); }
.timeline .tick span { position: absolute; top: 28px; left: 50%; transform: translateX(-50%); font-size: 10.5px; color: var(--muted); white-space: nowrap; }
.timeline .tick.done { background: var(--accent); }
.timeline .tick.done span { color: var(--ink); font-weight: 600; }
.timeline .tick:nth-child(even) span { top: -20px; }
.bars { display: grid; gap: 6px; }
.bars .b { display: grid; grid-template-columns: 110px 1fr 56px; gap: 8px; align-items: center; font-size: 13px; }
.bars .b i { display: block; height: 10px; background: var(--accent); border-radius: 3px; min-width: 2px; }
.bars .b span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.projects { display: grid; gap: 6px; }
.projects .p { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); flex-wrap: wrap; }
.projects .p.cur { border-color: var(--accent); background: var(--accent-soft); }

/* ---------- idea / structure ---------- */
.builder { font-family: var(--f-script); font-size: 16px; line-height: 1.6; padding: 16px 18px; background: var(--surface-2); border-radius: 8px; border: 1px dashed var(--line); }
.builder mark { background: var(--hl-soft); color: inherit; padding: 0 2px; border-radius: 2px; }
.builder .gap { color: var(--muted); border-bottom: 1px dashed var(--muted); }
.beat { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); }
.beat:first-child { border-top: 0; }
.beat .n { font-family: var(--f-display); font-weight: 800; font-size: 26px; color: var(--muted); line-height: 1; }
.beat.here .n { color: var(--accent); }
.beat h3 { font-size: 15px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.beat p { margin: 2px 0 8px; color: var(--muted); font-size: 13.5px; }
.beat .q { font-style: italic; }
.acts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.tension { width: 100%; height: auto; display: block; }
table.grid { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.grid th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 6px; border-bottom: 1px solid var(--line); }
table.grid td { padding: 4px; vertical-align: top; border-bottom: 1px solid var(--line); }
table.grid td textarea, table.grid td input { min-height: 38px; padding: 6px 8px; font-size: 13.5px; }
.scroll-x { overflow-x: auto; }

/* ---------- cast ---------- */
.cast { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 18px; align-items: start; }
.cast-list { display: grid; gap: 6px; }
.cast-list button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; cursor: pointer; display: grid; }
.cast-list button[aria-selected="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.cast-list b { font-family: var(--f-script); text-transform: uppercase; }
.cast-list small { color: var(--muted); }
.voice { font-family: var(--f-script); font-size: 14px; background: var(--surface-2); padding: 10px 14px; border-radius: 8px; white-space: pre-wrap; }

/* ---------- scene board ---------- */
.board { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 18px; align-items: start; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px 12px;
  box-shadow: var(--shadow); display: grid; gap: 6px; position: relative;
}
.card.dragging { opacity: 0.4; }
.card.drop { outline: 2px dashed var(--accent); }
.card .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; min-height: 24px; }
.card .no { font-family: var(--f-display); font-weight: 800; font-size: 20px; color: var(--accent); }
.card .slug { font-family: var(--f-script); font-weight: 700; text-transform: uppercase; font-size: 13.5px; border: 0; border-bottom: 1.5px solid var(--crit); border-radius: 0; background: transparent; padding: 2px 0 5px; }
.card .slug:focus { box-shadow: none; border-bottom-color: var(--accent); }
.card input.line { border: 0; border-bottom: 1px solid transparent; border-radius: 0; background: transparent; padding: 2px 0; font-size: 13.5px; }
.card input.line:focus { box-shadow: none; border-bottom-color: var(--accent); }
.card .lab { display: grid; grid-template-columns: 62px 1fr; align-items: center; gap: 6px; }
.card .lab span { font-size: 10.5px; font-weight: 700; letter-spacing: 0.07em; color: var(--muted); text-transform: uppercase; }
.card .who { font-size: 12px; color: var(--muted); }
.turn { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.turn button { border: 0; background: none; padding: 1px 8px; font-size: 12px; cursor: pointer; font-family: var(--f-script); }
.turn button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.pile { background: var(--surface-2); border: 1px dashed var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; }
.pile .card { box-shadow: none; }

/* ---------- script editor ---------- */
.script-view { display: grid; grid-template-columns: 220px minmax(0, 1fr) 300px; height: 100%; min-height: 0; }
.script-view.focus { grid-template-columns: 0 minmax(0, 1fr) 0; }
.script-view.focus .nav, .script-view.focus .companion { display: none; }
.nav { border-right: 1px solid var(--line); overflow-y: auto; padding: 12px 8px; background: var(--surface); }
.nav a { display: grid; grid-template-columns: 28px 1fr; gap: 4px; padding: 5px 8px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 12.5px; line-height: 1.35; }
.nav a:hover { background: var(--surface-2); }
.nav a.cur { background: var(--hl-soft); }
.nav a .sn { color: var(--muted); font-variant-numeric: tabular-nums; }
.nav a .sh { font-family: var(--f-script); text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav .sec { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 10px 8px 2px; }
.desk { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; min-width: 0; }
.toolbar { display: flex; gap: 6px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface); flex-wrap: wrap; }
.toolbar .els { display: flex; gap: 2px; flex-wrap: wrap; }
.toolbar .els button { border: 1px solid transparent; background: none; border-radius: 5px; padding: 3px 8px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
.toolbar .els button:hover { background: var(--surface-2); color: var(--ink); }
.toolbar .els button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-soft); font-weight: 600; }
.toolbar .els kbd { font-family: var(--f-ui); font-size: 10px; opacity: 0.7; margin-left: 3px; }
@media (max-width: 1560px) { .toolbar .els kbd { display: none; } }
.sheet { overflow: auto; padding: 28px 16px 120px; min-height: 0; container-type: inline-size; }
/* The page is 49em wide (60 characters of text plus margins), so 16px type gives a true-size page;
   narrower desks scale the whole page down together. */
.paper {
  --ch: 0.6em;
  font: min(16px, calc((100cqw - 4px) / 49))/1.3 var(--f-script);
  width: 49em; margin: 0 auto; background: var(--paper); color: var(--paper-ink);
  padding: 5em 7em 6em 6em; box-shadow: var(--shadow); min-height: 66em;
  border-left: 6px solid var(--rev, transparent); counter-reset: scene; outline: none; caret-color: var(--accent);
  white-space: pre-wrap; overflow-wrap: break-word;
}
.paper .el { position: relative; min-height: 1.3em; }
.paper .t-scene { text-transform: uppercase; font-weight: 700; margin-top: 2.6em; counter-increment: scene; }
.paper .t-scene::before { content: counter(scene); position: absolute; left: -5.5ch; font-weight: 400; color: var(--muted); }
.paper .t-action { margin-top: 1.3em; }
.paper .t-character { margin-left: calc(22 * var(--ch)); text-transform: uppercase; margin-top: 1.3em; max-width: calc(38 * var(--ch)); }
.paper .t-paren { margin-left: calc(16 * var(--ch)); max-width: calc(25 * var(--ch)); }
.paper .t-dialogue { margin-left: calc(10 * var(--ch)); max-width: calc(35 * var(--ch)); }
.paper .t-transition { text-align: right; text-transform: uppercase; margin-top: 1.3em; }
.paper .t-section { font: 600 12px/1.4 var(--f-ui); text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); margin-top: 2.6em; padding-top: 6px; border-top: 1px dashed var(--accent); }
.paper .el:first-child { margin-top: 0; }
.paper .el.cur::after {
  content: attr(data-label); position: absolute; right: -6.6em; top: 0.15em; width: 6em; font: 500 11px/1.2 var(--f-ui);
  color: var(--muted); text-transform: none; letter-spacing: 0; font-weight: 500; text-align: left; pointer-events: none;
}
.paper .el.cur.empty::before { content: attr(data-ph); position: absolute; left: 0; color: var(--muted); opacity: 0.6; pointer-events: none; font-weight: 400; }
.paper .t-scene.cur.empty::before { left: 0; }
.paper .el.flash { background: var(--hl-soft); transition: background 0.8s; }
.paper .el.lint { text-decoration: underline wavy var(--warn); text-decoration-skip-ink: none; text-underline-offset: 4px; }
.status { display: flex; gap: 16px; padding: 6px 14px; border-top: 1px solid var(--line); background: var(--surface); font-size: 12px; color: var(--muted); flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.status b { color: var(--ink); font-weight: 600; }
.companion { border-left: 1px solid var(--line); overflow-y: auto; padding: 16px; background: var(--surface); display: grid; gap: 18px; align-content: start; }
.companion h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); margin-bottom: 6px; }
.where b { font-family: var(--f-display); font-size: 34px; font-weight: 800; line-height: 1; }
.where .beatname { font-weight: 600; margin-top: 6px; }
.where p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
.prompt { font-size: 13.5px; padding: 10px 12px; background: var(--hl-soft); border-radius: 8px; line-height: 1.45; }
.lints { display: grid; gap: 6px; }
.lints button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 8px; font-size: 12.5px; cursor: pointer; display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: start; }
.lints button:hover { border-color: var(--muted); }
.sev { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; background: var(--muted); }
.sev.warn { background: var(--warn); } .sev.tip { background: var(--accent); }
.ac { position: fixed; z-index: 40; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 4px; min-width: 200px; max-width: 360px; }
.ac div { padding: 5px 10px; border-radius: 5px; font: 14px var(--f-script); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ac div[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
.ac small { display: block; padding: 2px 10px 4px; font: 11px var(--f-ui); color: var(--muted); }

/* ---------- page preview ---------- */
.pages { display: grid; gap: 24px; justify-content: center; padding: 28px 16px 80px; }
.pg { width: 8.5in; height: 11in; background: #fff; color: #111; position: relative; box-shadow: var(--shadow); font: 12pt/12pt var(--f-script); }
.pg .ln { position: absolute; white-space: pre; }
.pg .pn { position: absolute; right: 1in; top: 0.5in; }

/* =====================================================================

// Blake Snyder's "Save the Cat!" beats; page numbers are for a 110-page script.

  ['Opening Image', 1, 1, 'A snapshot of the hero and their world before the story changes them.', 'What single image shows who your hero is before anything happens?'],

  ['First obstacle', 'The first, most obvious attempt to solve the problem.'],

  ['Complication', 'A new plan after the midpoint; subplots deepen and cost rises.'],

  ['scene', 'Scene heading', 'INT. LOCATION - DAY'],
  ['action', 'Action', 'What we see and hear'],
  ['character', 'Character', 'NAME'],
  ['paren', 'Parenthetical', '(beat)'],
  ['dialogue', 'Dialogue', 'What they say'],

function scale(p, target) { return Math.max(1, Math.round((p * target) / 110)); }

/* =====================================================================
   Fountain import / export
   ===================================================================== */
const SCENE_RE = /^(INT\.?\/EXT|INT\/EXT|I\/E|INT|EXT|EST)[.\s]/i;

function stripComments(t) {
  return t.replace(/\/\*[\s\S]*?\*\//g, '').replace(/\[\[[\s\S]*?\]\]/g, '');

function isCharacterLine(line) {
  if (line.startsWith('@')) return true;
  const name = line.replace(/\(.*?\)/g, '').replace(/\^\s*$/, '').trim();
  return !!name && /[A-Za-z]/.test(name) && name === name.toUpperCase() && !name.startsWith('!');

function parseFountain(text) {
  text = stripComments(text.replace(/\r\n?/g, '\n').replace(/\t/g, '    '));
  let lines = text.split('\n');
  const title = {};
  let i = 0;
  while (i < lines.length && !lines[i].trim()) i++;
  if (i < lines.length && /^[A-Za-z][A-Za-z ]*:/.test(lines[i])) {
    let key = null;
    while (i < lines.length && lines[i].trim()) {
      const m = lines[i].match(/^([A-Za-z][A-Za-z ]*):\s*(.*)$/);
      if (m && !/^\s/.test(lines[i])) { key = m[1].trim().toLowerCase(); title[key] = m[2].trim() ? [m[2].trim()] : []; }
      else if (key) title[key].push(lines[i].trim());
      i++;
    }
    lines = lines.slice(i);
  }
  for (const k in title) title[k] = title[k].join('\n');
  const out = [];
  const n = lines.length;
  const blank = (k) => k < 0 || k >= n || !lines[k].trim();
  let inDialogue = false, lastAction = -2, pendingSynopsis = null;
  const push = (t, x) => { const b = { id: uid(), t, x }; out.push(b); return b; };
  for (let k = 0; k < n; k++) {
    const raw = lines[k], line = raw.trim();
    if (!line) { inDialogue = false; continue; }
    if (inDialogue) {
      if (line.startsWith('(') && line.endsWith(')')) push('paren', line);
      else push('dialogue', line.replace(/^~/, ''));
      continue;
    }
    const pb = blank(k - 1), nb = blank(k + 1);
    if (/^={3,}\s*$/.test(line)) continue;
    if (line.startsWith('#')) { push('section', line.replace(/^#+/, '').trim()); continue; }
    if (line.startsWith('=')) { pendingSynopsis = line.slice(1).trim(); const last = out[out.length - 1]; if (last && last.t === 'scene' && !last.syn) { last.syn = pendingSynopsis; pendingSynopsis = null; } continue; }
    if (line.startsWith('!')) { addAction(raw.trimStart().slice(1)); continue; }
    if (line.startsWith('>') && line.endsWith('<')) { addAction(line.slice(1, -1).trim()); continue; }
    if (line.startsWith('>')) { push('transition', line.slice(1).trim().toUpperCase()); continue; }
    if (pb && ((line.startsWith('.') && line.length > 1 && line[1] !== '.') || SCENE_RE.test(line))) {
      const b = push('scene', (line.startsWith('.') ? line.slice(1) : line).replace(/\s*#[\w.-]+#\s*$/, '').trim().toUpperCase());
      if (pendingSynopsis) { b.syn = pendingSynopsis; pendingSynopsis = null; }
      continue;
    }
    if (pb && nb && line === line.toUpperCase() && /TO:$/.test(line)) { push('transition', line); continue; }
    if (pb && !nb && isCharacterLine(line)) { push('character', line.replace(/^@/, '').replace(/\^\s*$/, '').trim()); inDialogue = true; continue; }
    addAction(raw.trimEnd());
    function addAction(t) {
      const last = out[out.length - 1];
      if (lastAction === k - 1 && last && last.t === 'action') last.x += '\n' + t;
      else push('action', t);
      lastAction = k;
    }
  }

    title: strip(title.title || '').replace(/\n/g, ' ').trim(),
    author: strip(title.author || title.authors || '').replace(/\n/g, ', '),
    contact: title.contact || '',
    draftDate: (title['draft date'] || '').replace(/\n/g, ' '),
    blocks: out,
  };
}

function toFountain(p) {
  const out = [];
  out.push(`Title: ${p.title || 'Untitled'}`);
  out.push('Credit: Written by');
  out.push(`Author: ${p.author || ''}`);
  if (p.draftDate) out.push(`Draft date: ${p.draftDate}`);
  if (p.contact) out.push('Contact:\n' + p.contact.split('\n').map((l) => '    ' + l).join('\n'));
  out.push('');
  const s = p.script;
  for (let i = 0; i < s.length; i++) {
    const b = s[i], x = (b.x || '').trimEnd();
    const prev = s[i - 1];
    const inGroup = (b.t === 'dialogue' || b.t === 'paren') && prev && ['character', 'dialogue', 'paren'].includes(prev.t);
    if (!x && b.t !== 'dialogue') continue;
    if (!inGroup) out.push('');
    switch (b.t) {
      case 'scene': out.push((SCENE_RE.test(x) ? '' : '.') + x.toUpperCase()); break;
      case 'section': out.push('# ' + x); break;
      case 'character': out.push((/[A-Za-z]/.test(x) ? '' : '@') + x.toUpperCase()); break;
      case 'paren': out.push(`(${x.replace(/^\(|\)$/g, '')})`); break;
      case 'dialogue': out.push(x || '  '); break;
      case 'transition': out.push(/TO:$/.test(x.toUpperCase()) ? x.toUpperCase() : '> ' + x.toUpperCase()); break;
      default:
        out.push(x.split('\n').map((l) => {
          const t = l.trim();
          const risky = (t && t === t.toUpperCase() && /[A-Z]/.test(t)) || SCENE_RE.test(t) || /^[.#=>~@!]/.test(t);
          return risky ? '!' + l : l;
        }).join('\n'));
    }
  }
  return out.join('\n').replace(/\n{3,}/g, '\n\n') + '\n';
}

/* =====================================================================
   Screenplay layout: US Letter, Courier 12pt, 6 lines/inch, 54 lines/page
   ===================================================================== */
const LAY = { scene: [1.5, 60, 2], action: [1.5, 60, 1], character: [3.7, 38, 1], paren: [3.1, 25, 0], dialogue: [2.5, 35, 0], transition: [1.5, 60, 1] };
const LPP = 54;
const RIGHT = 7.5;

function styled(text) {

      for (const ch of s.slice(pos, m.index)) out.push([ch, b, i, u]);
      if (m[1]) out.push([m[1][1], b, i, u]);

function wrapStyled(text, width) {
  // Returns an array of lines; each line is an array of [ch, b, i, u].
  const res = [];
  for (const para of String(text).split('\n')) {
    const chars = styled(para);
    const plain = chars.map((c) => c[0]).join('');
    if (!plain.trim()) { res.push([]); continue; }
    let start = 0;
    const n = plain.length;
    while (start < n) {
      let end, next;
      if (n - start <= width) { end = n; next = n; }
      else {
        const cut = plain.lastIndexOf(' ', start + width);
        if (cut <= start) { end = next = start + width; } else { end = cut; next = cut + 1; }
      }
      res.push(chars.slice(start, end));
      start = next;
      while (start < n && plain[start] === ' ') start++;

  }
  return res;
}

function layoutScript(script) {
  // Build printable blocks from editor blocks.
  const blocks = [];
  for (let i = 0; i < script.length; i++) {
    const b = script[i];
    const x = (b.x || '').trim() ? b.x : '';
    if (b.t === 'section') { blocks.push({ kind: 'section', title: x, src: i, lines: [] }); continue; }
    if (b.t === 'character') {
      const lines = wrapStyled(x.toUpperCase(), LAY.character[1]).map((c) => ({ x: LAY.character[0], c, kind: 'character', src: i }));
      let j = i + 1;
      while (j < script.length && (script[j].t === 'paren' || script[j].t === 'dialogue')) {
        const s = script[j];
        if ((s.x || '').trim()) {
          wrapStyled(s.x, LAY[s.t][1]).forEach((c, k) => lines.push({ x: LAY[s.t][0] + (s.t === 'paren' && k ? 0.1 : 0), c, kind: s.t, src: j }));
        }
        j++;
      }
      blocks.push({ kind: 'dialogue', lines, space: 1, split: true, src: i, name: x.replace(/\s*\(.*?\)/g, '').trim().toUpperCase() });
      i = j - 1;
      continue;
    }
    if (!x) continue;
    if (b.t === 'scene') {
      blocks.push({ kind: 'scene', lines: wrapStyled(x.toUpperCase(), 60).map((c) => ({ x: 1.5, c, kind: 'scene', src: i })), space: 2, keep: true, src: i, id: b.id });
    } else if (b.t === 'transition') {
      blocks.push({ kind: 'transition', lines: [{ x: RIGHT, c: styled(x.toUpperCase()), align: 'right', kind: 'transition', src: i }], space: 1, src: i });
    } else {
      const t = b.t === 'paren' || b.t === 'dialogue' ? 'action' : b.t;
      blocks.push({ kind: 'action', lines: wrapStyled(x, 60).map((c) => ({ x: 1.5, c, kind: t, src: i })), space: 1, split: true, src: i });
    }
  }
  // Paginate.
  const pages = [[]];
  let used = 0;
  const srcPage = new Array(script.length).fill(0);
  const scenes = [];
  const outline = [];
  let scene = null;
  const q = blocks.slice();
  const place = (blk, space) => {
    if (scene) scene.lines += space + blk.lines.length;
    used += space;
    for (const ln of blk.lines) {
      pages[pages.length - 1].push({ row: used, ...ln });
      if (!srcPage[ln.src]) srcPage[ln.src] = pages.length;
      used++;
    }
  };
  const newPage = () => { pages.push([]); used = 0; };
  while (q.length) {
    const blk = q.shift();
    if (blk.kind === 'section') { srcPage[blk.src] = pages.length; outline.push({ level: 0, title: blk.title, page: pages.length }); continue; }
    let space = used ? blk.space : 0;
    let need = space + blk.lines.length;
    if (blk.keep) {
      const nx = q.find((b) => b.lines.length);
      if (nx) need += nx.space + Math.min(2, nx.lines.length);
    }
    if (used + need > LPP) {
      let head = null, tail = null;
      if (blk.split && used) [head, tail] = splitBlock(blk, LPP - used - space);
      else if (!used) [head, tail] = splitBlock(blk, LPP, true);
      if (head) { place(head, space); newPage(); q.unshift(tail); continue; }
      if (used) { newPage(); space = 0; }
    }
    if (blk.kind === 'scene') {
      scene = { id: blk.id, src: blk.src, heading: blk.lines.map((l) => l.c.map((c) => c[0]).join('')).join(' '), page: pages.length, lines: 0 };
      scenes.push(scene);
      outline.push({ level: 1, title: `${scenes.length}. ${scene.heading}`, page: pages.length });
    }
    place(blk, space);
  }
  // Fill page numbers for blocks that produced no lines (empty ones) from their neighbours.
  let last = 1;
  for (let i = 0; i < srcPage.length; i++) { if (srcPage[i]) last = srcPage[i]; else srcPage[i] = last; }
  return { pages, srcPage, scenes, outline, pageCount: pages.length === 1 && !pages[0].length ? 0 : pages.length };
}

function splitBlock(blk, room, force) {
  const lines = blk.lines;
  let k;
  if (force) {
    if (lines.length <= room) return [null, null];
    k = room;
  } else if (blk.kind === 'dialogue') {
    k = null;
    for (let c = 2; c <= Math.min(room - 1, lines.length - 1); c++) if (lines[c - 1].kind === 'dialogue') k = c;
    if (k == null) return [null, null];
    const name = lines[0].c.map((c) => c[0]).join('');
    const cont = /CONT'D/.test(name) ? name : `${name} (CONT'D)`;
    return [
      { ...blk, lines: lines.slice(0, k).concat([{ x: LAY.character[0], c: styled('(MORE)'), kind: 'more', src: lines[k - 1].src }]) },
      { ...blk, space: 0, lines: [{ x: LAY.character[0], c: styled(cont), kind: 'character', src: lines[k].src }].concat(lines.slice(k)) },
    ];
  } else {
    k = Math.min(room, lines.length - 2);
    if (k < 2) return [null, null];
  }
  return [{ ...blk, lines: lines.slice(0, k) }, { ...blk, space: 0, lines: lines.slice(k), keep: false }];
}

function eighths(lines) {
  const n = Math.max(1, Math.round(lines / (LPP / 8)));
  const w = Math.floor(n / 8), r = n % 8;
  return w && r ? `${w} ${r}/8` : w ? `${w}` : `${r}/8`;
}

/* =====================================================================
   Script analysis: stats and lint
   ===================================================================== */
function analyze(p, lay) {
  const s = p.script;
  const chars = {};
  const sceneOf = new Array(s.length).fill(-1);
  let sc = -1;
  let totalWords = 0;
  for (let i = 0; i < s.length; i++) {
    if (s[i].t === 'scene') sc++;
    sceneOf[i] = sc;
    totalWords += words(s[i].x);
  }
  for (let i = 0; i < s.length; i++) {
    if (s[i].t !== 'character' || !(s[i].x || '').trim()) continue;
    const name = s[i].x.replace(/\s*\(.*?\)/g, '').trim().toUpperCase();
    const c = chars[name] || (chars[name] = { name, speeches: 0, words: 0, scenes: new Set(), first: i, lines: [] });
    c.speeches++;
    c.scenes.add(sceneOf[i]);
    for (let j = i + 1; j < s.length && (s[j].t === 'dialogue' || s[j].t === 'paren'); j++) {
      if (s[j].t === 'dialogue') { c.words += words(s[j].x); if (c.lines.length < 60) c.lines.push(s[j].x); }
    }
  }
  const ie = { INT: 0, EXT: 0, 'INT/EXT': 0 }, tod = {};
  const locations = new Set();
  for (const b of s) {
    if (b.t !== 'scene' || !(b.x || '').trim()) continue;
    const h = b.x.toUpperCase().trim();
    if (/^(INT\.?\/EXT|I\/E)/.test(h)) ie['INT/EXT']++; else if (/^INT/.test(h)) ie.INT++; else if (/^EXT/.test(h)) ie.EXT++;
    const m = h.match(/^(?:INT\.?\/EXT\.?|INT\/EXT\.?|I\/E\.?|INT\.?|EXT\.?|EST\.?)\s*(.*?)(?:\s+-\s+(.*))?$/);
    if (m && m[1]) locations.add(m[1].trim());
    if (m && m[2]) tod[m[2].trim()] = (tod[m[2].trim()] || 0) + 1;
  }
  return { chars, sceneOf, words: totalWords, ie, tod, locations: [...locations] };
}

function lint(p, lay, an) {
  const s = p.script;
  const out = [];
  const add = (i, sev, msg) => out.push({ i, id: s[i].id, sev, msg });
  const introduced = new Set();
  for (let i = 0; i < s.length; i++) {
    const b = s[i];
    const x = (b.x || '').trim();
    if (!x) continue;
    if (b.t === 'action') {
      const lines = wrapStyled(x, 60).length;
      if (lines > 4) add(i, 'warn', `Action paragraph runs ${lines} lines. Break it up; four lines or fewer reads faster.`);
      if (/\bwe (see|hear|watch|notice)\b/i.test(x)) add(i, 'tip', '"We see" / "we hear" can usually go: just describe what happens.');
      if (/\b(camera|pan(s)? (to|across)|zoom(s)? in|angle on|close on|dolly)\b/i.test(x)) add(i, 'tip', 'Camera directions are usually left out of a spec script.');
      for (const m of x.matchAll(/\b([A-Z][A-Z'.-]{1,}(?: [A-Z][A-Z'.-]{1,})*)\b/g)) introduced.add(m[1]);
    }
    if (b.t === 'scene') {
      const h = x.toUpperCase();
      if (!SCENE_RE.test(h) && !/^(MONTAGE|FLASHBACK|INTERCUT|SERIES OF SHOTS|BACK TO)/.test(h)) add(i, 'warn', 'Scene headings usually start with INT. or EXT.');
      else if (SCENE_RE.test(h) && !/ - /.test(h)) add(i, 'tip', 'Add the time of day: INT. KITCHEN - NIGHT.');
    }
    if (b.t === 'paren') {
      if (x.length > 30) add(i, 'tip', 'Long parenthetical. Keep them to a few words, or make it action.');
      if (/\b\w+ly\b/i.test(x)) add(i, 'tip', 'Adverb parenthetical. Can the line or an action show that instead?');
    }
    if (b.t === 'character') {
      const name = x.replace(/\s*\(.*?\)/g, '').trim().toUpperCase();
      const c = an.chars[name];
      if (c && c.first === i && ![...introduced].some((w) => w === name || w.startsWith(name + ' ') || w.split(' ')[0] === name)) {
        add(i, 'tip', `${name} speaks before being introduced. Introduce them in CAPS in the action with an age, e.g. "${name} (40s)".`);
      }
      let n = 0;
      for (let j = i + 1; j < s.length && (s[j].t === 'dialogue' || s[j].t === 'paren'); j++) if (s[j].t === 'dialogue') n += wrapStyled(s[j].x || '', 35).length;
      if (n > 10) add(i, 'warn', `${name} has a ${n}-line speech. Could it be cut, or broken up by action or another voice?`);
    }
    if (b.t === 'dialogue' && /^(hi|hello|hey|good (morning|evening|afternoon))\b[,.!]?/i.test(x) && x.length < 30) add(i, 'tip', 'Small talk. Can the scene start after the greeting?');
  }
  const target = p.mode === 'tv' ? TV_STRUCTURE[p.tvFormat].at(-1)[2] : p.targetPages;
  if (lay.pageCount > target * 1.15) out.push({ i: -1, sev: 'warn', msg: `The draft is ${lay.pageCount} pages; your target is about ${target}.` });
  return out;
}

function currentBeat(p, page) {
  if (p.mode === 'tv') {
    const acts = TV_STRUCTURE[p.tvFormat];
    const a = acts.find(([, x, y]) => page >= x && page < y) || acts.at(-1);
    return { name: a[0], range: `pp. ${a[1]}–${a[2]}`, desc: page >= a[2] - 2 ? 'Build to the act out: end on a question that carries us through the break.' : 'Keep the A story moving; weave in the B and C stories.', q: 'What question will the audience carry into the break?' };
  }
  const t = p.targetPages;
  // Point beats win when the page is on them; otherwise the span we're inside.
  const pts = BEATS.filter((b) => b[1] === b[2]);
  const onPoint = pts.find((b) => Math.abs(scale(b[1], t) - page) <= 1);
  const span = BEATS.filter((b) => b[1] !== b[2] && page >= scale(b[1], t) && page <= scale(b[2], t)).at(-1);
  const b = onPoint || span || BEATS.at(-1);
  return { name: b[0], range: pageRange(b[1], b[2], t), desc: b[3], q: b[4], idx: BEATS.indexOf(b) };
}

/* =====================================================================
   Script editor: one contenteditable page whose children are elements.
   The model (P.script) is the source of truth; the DOM is re-read after
   native typing and re-rendered after structural edits.
   ===================================================================== */
const Editor = {
  el: null,
  undo: [],
  redo: [],
  lastPush: 0,
  ac: null, // autocomplete state
  onChange: null,
  onCaret: null,

  mount(container) {
    const el = document.createElement('div');

    el.setAttribute('aria-multiline', 'true');

    el.addEventListener('keydown', (e) => this.keydown(e));
    el.addEventListener('beforeinput', (e) => this.beforeinput(e));

  unmount() {

  },
  render() {
    if (!this.el) return;

  },
  renderBlock(i) {

    const tmp = document.createElement('div');

  },

  /* ---------- caret helpers ---------- */
  caret() {

    let node = sel.anchorNode;
    while (node && node.parentNode !== this.el) node = node.parentNode;
    if (!node) return null;
    const i = Array.prototype.indexOf.call(this.el.children, node);
    const r = document.createRange();
    r.selectNodeContents(node);
    r.setEnd(sel.anchorNode, sel.anchorOffset);

  },
  setCaret(i, off) {

    if (!div) return;
    const sel = document.getSelection();
    const r = document.createRange();
    let remaining = off;
    const walker = document.createTreeWalker(div, NodeFilter.SHOW_TEXT);
    let node, placed = false;
    while ((node = walker.nextNode())) {
      if (remaining <= node.length) { r.setStart(node, remaining); placed = true; break; }
      remaining -= node.length;

    r.collapse(true);

  },
  scrollTo(i, flash) {
    const div = this.el && this.el.children[i];

    div.scrollIntoView({ block: 'center', behavior: 'smooth' });
    if (flash) { div.classList.add('flash'); setTimeout(() => div.classList.remove('flash'), 900); }
  },

  /* ---------- model sync ---------- */
  readDOM() {
    // Normalize stray nodes the browser may create, then rebuild the model.
    const known = new Map(P.script.map((b) => [b.id, b]));
    const seen = new Set();
    const next = [];
    let dirty = false;
    for (const node of Array.from(this.el.childNodes)) {
      if (node.nodeType === 3) {
        if (!node.textContent.trim()) { node.remove(); continue; }
        const div = document.createElement('div');

  fromDiv(div, known, seen) {

  },
  changed(structural) {

  /* ---------- history ---------- */
  snapshot() { return { script: JSON.stringify(P.script), caret: this.caret() }; },
  push(force) {

  },
  restore(from, to) {

    P.script = JSON.parse(snap.script);
    this.render();
    if (snap.caret) this.setCaret(snap.caret.i, snap.caret.off);
    this.lastPush = 0;
    this.changed(true);
  },

  /* ---------- editing operations ---------- */
  setType(t, i) {
    const c = this.caret();
    if (i == null) { if (!c) return; i = c.i; }
    if (P.script[i].t === t) return;
    this.push(true);
    this.readDOM();
    P.script[i].t = t;
    if (t === 'paren') {
      const x = P.script[i].x.trim();
      if (x && !x.startsWith('(')) P.script[i].x = `(${x})`;
    }

    this.setCaret(i, c && c.i === i ? c.off : (P.script[i].x || '').length);

  },
  insertAfter(i, block) {
    P.script.splice(i + 1, 0, block);
    const tmp = document.createElement('div');
    tmp.innerHTML = this.blockHTML(block);
    if (i < 0) this.el.prepend(tmp.firstChild);
    else this.el.children[i].after(tmp.firstChild);
  },
  enter(shift) {

    if (!sel.isCollapsed) { document.execCommand('delete'); this.readDOM(); }
    const c = this.caret();

    this.push(true);
    this.readDOM();
    const b = P.script[c.i];
    const x = b.x || '';
    if (shift && (b.t === 'action' || b.t === 'dialogue')) {
      b.x = x.slice(0, c.off) + '\n' + x.slice(c.off);

      this.setCaret(c.i, c.off + 1);

    }

      this.setCaret(c.i, 0);

    if (b.t === 'action' && SCENE_RE.test(x.trim())) b.t = 'scene';

    let before = x.slice(0, c.off);

  backspace(e) {

    this.changed(true);
  },
  del(e) {

    if (c.off !== (b.x || '').length || c.i >= P.script.length - 1) return;
    e.preventDefault();
    this.push(true);
    const next = P.script[c.i + 1];
    b.x = (b.x || '') + (next.x || '');
    P.script.splice(c.i + 1, 1);
    this.el.children[c.i + 1].remove();
    this.renderBlock(c.i);
    this.setCaret(c.i, c.off);
    this.changed(true);
  },
  cycle(dir) {
    const c = this.caret();
    if (!c) return;
    const b = P.script[c.i];
    const k = CYCLE.indexOf(b.t);
    const t = CYCLE[(k + dir + CYCLE.length) % CYCLE.length];
    this.setType(t);
  },

  /* ---------- events ---------- */
  keydown(e) {
    const mod = e.metaKey || e.ctrlKey;
    if (this.ac) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); this.moveAC(e.key === 'ArrowDown' ? 1 : -1); return; }
      if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); this.acceptAC(); return; }
      if (e.key === 'Escape') { e.preventDefault(); this.closeAC(); return; }
    }
    if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? this.restore(this.redo, this.undo) : this.restore(this.undo, this.redo); return; }
    if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); this.restore(this.redo, this.undo); return; }
    if (mod && (e.key.toLowerCase() === 'b' || e.key.toLowerCase() === 'i' || e.key.toLowerCase() === 'u')) { e.preventDefault(); this.wrapSelection({ b: '**', i: '*', u: '_' }[e.key.toLowerCase()]); return; }
    if (e.altKey && /^Digit[1-7]$/.test(e.code)) { e.preventDefault(); this.setType(ELEMENTS[+e.code.slice(5) - 1][0]); return; }
    if (e.key === 'Enter') { e.preventDefault(); this.enter(e.shiftKey); return; }
    if (e.key === 'Tab') { e.preventDefault(); this.cycle(e.shiftKey ? -1 : 1); return; }
    if (e.key === 'Backspace') { this.backspace(e); return; }
    if (e.key === 'Delete') { this.del(e); return; }
  },
  beforeinput(e) {
    if (e.inputType === 'historyUndo') { e.preventDefault(); this.restore(this.undo, this.redo); return; }
    if (e.inputType === 'historyRedo') { e.preventDefault(); this.restore(this.redo, this.undo); return; }
    if (e.inputType === 'insertParagraph' || e.inputType === 'insertLineBreak') { e.preventDefault(); return; }
    const sel = document.getSelection();
    this.push(!sel.isCollapsed);
  },
  input() {
    const c = this.caret();
    const dirty = this.readDOM();
    if (dirty && c) this.setCaret(c.i, c.off);
    if (c) this.autoType(c.i);
    this.changed(false);
    this.suggest();
  },
  autoType(i) {
    const b = P.script[i];
    const x = b.x || '';
    let t = null;
    if (b.t === 'action' && /^(int|ext|est|int\.?\/ext|i\/e)[.\s]/i.test(x) && !x.includes('\n')) t = 'scene';
    if (b.t === 'dialogue' && x.startsWith('(')) t = 'paren';
    if (t) {
      const c = this.caret();
      b.t = t;
      this.renderBlock(i);
      this.setCaret(i, c ? c.off : x.length);
    }
  },
  paste(e) {
    e.preventDefault();
    const text = (e.clipboardData.getData('text/plain') || '').replace(/\r\n?/g, '\n');
    if (!text) return;
    this.push(true);
    if (!text.includes('\n')) { document.execCommand('insertText', false, text); return; }
    const sel = document.getSelection();
    if (!sel.isCollapsed) document.execCommand('delete');
    this.readDOM();
    const c = this.caret() || { i: P.script.length - 1, off: (P.script.at(-1).x || '').length };
    const b = P.script[c.i];
    const before = (b.x || '').slice(0, c.off), after = (b.x || '').slice(c.off);
    let blocks = parseFountain(text).blocks;
    if (!blocks.length) return;
    b.x = before;
    const ins = blocks;
    const keepB = before.trim() !== '';
    const start = keepB ? c.i + 1 : c.i;
    P.script.splice(start, keepB ? 0 : 1, ...ins);
    let last = start + ins.length - 1;
    if (after.trim()) { P.script.splice(last + 1, 0, { id: uid(), t: b.t, x: after }); }
    this.render();
    this.setCaret(last, (P.script[last].x || '').length);
    this.scrollTo(last);
    this.changed(true);
  },
  wrapSelection(mark) {
    const sel = document.getSelection();
    if (sel.isCollapsed) return;
    const text = sel.toString();
    if (text.includes('\n')) return;
    this.push(true);
    document.execCommand('insertText', false, mark + text + mark);
  },

  /* ---------- caret moved: update toolbar/companion ---------- */
  caretMoved() {
    const c = this.caret();
    if (!c) return;
    if (this._cur !== c.i || !this.el.children[c.i]?.classList.contains('cur')) {
      $$('.el.cur', this.el).forEach((d) => d.classList.remove('cur'));
      this.el.children[c.i]?.classList.add('cur');
      this._cur = c.i;
    }
    if (this.onCaret) this.onCaret(c.i);
  },

  /* ---------- autocomplete ---------- */
  suggest() {
    const c = this.caret();
    if (!c) return this.closeAC();
    const b = P.script[c.i];
    const x = (b.x || '');
    const X = x.toUpperCase();
    let items = [], mode = null, note = '';
    if (b.t === 'character' && c.off === x.length) {
      const names = new Set();
      for (const s of P.script) if (s.t === 'character' && s !== b && s.x.trim()) names.add(s.x.replace(/\s*\(.*?\)/g, '').trim().toUpperCase());
      for (const ch of P.characters) if (ch.name) names.add(ch.name.toUpperCase());
      if (/\($/.test(X) || /\s\($/.test(X)) {
        items = ['V.O.)', 'O.S.)', "CONT'D)", 'O.C.)'].map((s) => X + s); note = 'Extensions';
      } else if (X.trim()) {
        items = [...names].filter((n) => n.startsWith(X.trim()) && n !== X.trim()).slice(0, 6);
        note = 'Characters';
      }
      mode = 'replace';
    } else if (b.t === 'scene' && c.off === x.length) {
      const m = X.match(/^((?:INT\.?\/EXT|INT\/EXT|I\/E|INT|EXT|EST)\.?\s+)(.*)$/);
      if (!X.trim()) { items = ['INT. ', 'EXT. ', 'INT./EXT. ']; note = 'Scene heading'; }
      else if (m && !/ - /.test(m[2])) {
        const locs = analyze(P, getLayout()).locations;
        items = locs.filter((l) => l.startsWith(m[2].trim()) && l !== m[2].trim()).slice(0, 6).map((l) => m[1] + l + ' - ');
        note = 'Locations';
      } else if (/ - $/.test(X) || / - [A-Z]*$/.test(X)) {
        const part = X.split(' - ').at(-1);
        items = ['DAY', 'NIGHT', 'CONTINUOUS', 'LATER', 'MOMENTS LATER', 'MORNING', 'EVENING', 'DAWN', 'DUSK']
          .filter((t) => t.startsWith(part) && t !== part).map((t) => X.slice(0, X.length - part.length) + t);
        note = 'Time of day';
      }
      mode = 'replace';
    } else if (b.t === 'transition' && c.off === x.length) {
      items = ['CUT TO:', 'SMASH CUT TO:', 'MATCH CUT TO:', 'DISSOLVE TO:', 'FADE OUT.', 'FADE IN:'].filter((t) => t.startsWith(X.trim()) && t !== X.trim());
      note = 'Transitions';
      mode = 'replace';
    }
    if (!items.length) return this.closeAC();
    this.ac = { i: c.i, items, sel: 0, mode, note };
    this.drawAC();
  },
  drawAC() {
    let box = $('#ac');
    if (!box) { box = document.createElement('div'); box.id = 'ac'; box.className = 'ac'; box.setAttribute('role', 'listbox'); document.body.appendChild(box); }
    const div = this.el.children[this.ac.i];
    const r = div.getBoundingClientRect();
    const indent = parseFloat(getComputedStyle(div).marginLeft) || 0;
    box.style.left = Math.min(r.left, window.innerWidth - 240) + 'px';
    box.style.top = Math.min(r.bottom + 4, window.innerHeight - 220) + 'px';
    box.innerHTML = `<small>${esc(this.ac.note)} · Tab to accept</small>` + this.ac.items.map((s, k) => `<div role="option" data-k="${k}" aria-selected="${k === this.ac.sel}">${esc(s)}</div>`).join('');
    box.onmousedown = (ev) => { const d = ev.target.closest('[data-k]'); if (d) { ev.preventDefault(); this.ac.sel = +d.dataset.k; this.acceptAC(); } };
    void indent;
  },
  moveAC(d) { this.ac.sel = (this.ac.sel + d + this.ac.items.length) % this.ac.items.length; this.drawAC(); },
  acceptAC() {
    const { i, items, sel } = this.ac;
    this.push(true);
    P.script[i].x = items[sel];
    this.renderBlock(i);
    this.setCaret(i, items[sel].length);
    this.closeAC();
    this.changed(false);
    this.suggest();
  },
  closeAC() { this.ac = null; const box = $('#ac'); if (box) box.remove(); },
};

   State and saving
   ===================================================================== */
let LIB = { current: null, projects: {} };
let P = null;
let layoutDirty = true;
let _layout = null, _analysis = null;
const state = { view: 'home', sub: {}, castSel: 0, preview: false, focus: false, episode: 0 };
const caps = { db: null, userId: null, sample: null, downloads: null };
const inFrame = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
const LS_KEY = 'draftroom.v1';

function getLayout() {
  if (layoutDirty || !_layout) { _layout = layoutScript(P.script); _analysis = null; layoutDirty = false; }
  return _layout;
}
function getAnalysis() { const lay = getLayout(); if (!_analysis) _analysis = analyze(P, lay); return _analysis; }

function blankProject(title) {
  return {
    id: uid(), title: title || 'Untitled', author: '', contact: '', draftDate: '', mode: 'film', targetPages: 110, tvFormat: 'hour', revision: 'White',
    idea: {}, beats: {}, acts: {}, sequences: {}, subplots: [{ name: 'A story' }, { name: 'B story' }, { name: 'C story' }],
    tv: { episodes: [], structure: {} }, characters: [], ideas: [], cards: {},
    script: [{ id: uid(), t: 'scene', x: '' }], checklist: {}, feedback: [], notes: '',
    created: Date.now(), updated: Date.now(),
  };
}
function normalize(p) {
  const b = blankProject();
  for (const k of Object.keys(b)) if (p[k] == null) p[k] = b[k];
  if (!Array.isArray(p.script) || !p.script.length) p.script = b.script;
  p.script.forEach((s) => { if (!s.id) s.id = uid(); if (!EL[s.t]) s.t = 'action'; if (typeof s.x !== 'string') s.x = ''; });
  return p;
}

const Store = {
  timer: null,
  queue: Promise.resolve(),
  written: {},
  status(text, err) { const el = $('#save-state'); if (el) { el.textContent = text; el.classList.toggle('err', !!err); } },
  readLocal() {
    try { const raw = localStorage.getItem(LS_KEY); if (raw) return JSON.parse(raw); } catch (e) { /* storage blocked */ }
    return null;
  },
  writeLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(LIB)); return true; } catch (e) { return false; }
  },
  schedule() {
    this.status('Saving…');
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.flush(), 700);
  },
  async flush() {
    clearTimeout(this.timer);
    const localOK = this.writeLocal();
    if (caps.db && caps.userId) {
      try { await this.pushRemote(P); this.status('Saved to your account'); }
      catch (e) { this.status(localOK ? 'Saved in this browser (account save failed)' : 'Not saved: export a backup', !localOK); }
    } else {
      this.status(localOK ? 'Saved in this browser' : 'Not saved: export a backup', !localOK);
    }
  },
  path(k) { return `data/users/${caps.userId}/${k}`; },
  async write(path, body) {
    const str = JSON.stringify(body);
    if (this.written[path] === str) return;
    await caps.db.doc(path).set(body);
    this.written[path] = str;
  },
  pushRemote(p) {
    const job = async () => {
      const { script, ...meta } = p;
      const chunks = [];
      let cur = [], size = 0;
      for (const b of script) {
        const n = JSON.stringify(b).length;
        if (size + n > 150000 && cur.length) { chunks.push(cur); cur = []; size = 0; }
        cur.push(b); size += n;
      }
      chunks.push(cur);
      for (let k = 0; k < chunks.length; k++) await this.write(this.path(`p_${p.id}_s${k}`), { blocks: JSON.stringify(chunks[k]) });
      await this.write(this.path(`p_${p.id}`), { meta: JSON.stringify(meta), chunks: chunks.length, updated: p.updated });
      await this.write(this.path('index'), { current: LIB.current, list: JSON.stringify(Object.values(LIB.projects).map((x) => ({ id: x.id, title: x.title, updated: x.updated }))) });
    };
    this.queue = this.queue.then(job, job);
    return this.queue;
  },
  async pullRemote(id) {
    const m = await caps.db.doc(this.path(`p_${id}`)).get();
    if (!m.exists) return null;
    const d = m.data();
    const meta = JSON.parse(d.meta);
    const script = [];
    for (let k = 0; k < d.chunks; k++) {
      const c = await caps.db.doc(this.path(`p_${id}_s${k}`)).get();
      if (c.exists) script.push(...JSON.parse(c.data().blocks));
    }
    return normalize({ ...meta, script });
  },
  async removeRemote(id) {
    if (!caps.db || !caps.userId) return;
    try {
      const m = await caps.db.doc(this.path(`p_${id}`)).get();
      const n = m.exists ? m.data().chunks : 0;
      for (let k = 0; k < n; k++) await caps.db.doc(this.path(`p_${id}_s${k}`)).delete();
      await caps.db.doc(this.path(`p_${id}`)).delete();
    } catch (e) { /* best effort */ }
  },
  async sync() {
    // Merge account copies with this browser's copies; newest wins per project.
    try {
      const idx = await caps.db.doc(this.path('index')).get();
      let changedCurrent = false;
      if (idx.exists) {
        const list = JSON.parse(idx.data().list || '[]');
        for (const r of list) {
          const local = LIB.projects[r.id];
          if (!local || (r.updated || 0) > (local.updated || 0)) {
            const p = await this.pullRemote(r.id);
            if (p) { LIB.projects[p.id] = p; if (p.id === LIB.current) changedCurrent = true; }
          }
        }
        if (!LIB.projects[LIB.current] && idx.data().current) LIB.current = idx.data().current;
      }
      for (const p of Object.values(LIB.projects)) await this.pushRemote(p);
      this.writeLocal();
      this.status('Saved to your account');
      if (changedCurrent || P !== LIB.projects[LIB.current]) { openProject(LIB.current, true); }
    } catch (e) {
      this.status('Saved in this browser');
    }
  },
};

let railTimer = null;
function touch(structural) {
  P.updated = Date.now();
  if (structural) layoutDirty = true;
  Store.schedule();
  clearTimeout(railTimer);
  railTimer = setTimeout(renderRail, 500);
}

function openProject(id, quiet) {
  if (!LIB.projects[id]) id = Object.keys(LIB.projects)[0];
  LIB.current = id;
  P = normalize(LIB.projects[id]);
  layoutDirty = true;
  Editor.undo = []; Editor.redo = [];
  state.castSel = 0; state.episode = 0;
  $('#proj-name').textContent = P.title || 'Untitled';
  renderRail();
  renderView();
  if (!quiet) Store.writeLocal();
}
function addProject(p, open = true) {
  p = normalize(p);
  LIB.projects[p.id] = p;
  if (open) openProject(p.id);
  touch();
  return p;
}

const SAMPLE_FOUNTAIN = `Title: The Last Train North
Credit: Written by
Author: Example Writer
Draft date: First Draft

# ACT ONE

FADE IN:

EXT. RAIL YARD - NIGHT

Sodium lights buzz over rows of dead freight cars. Snow drifts through the beams.

MAYA REYES (30s, grease-stained overalls, eyes that never stop scanning) walks the line with a flashlight, tapping each coupling with a wrench.

*Clang.* *Clang.* Then a hollow _thunk_.

She stops. Crouches. Something is taped under the car: an envelope.

MAYA
(to herself)
You've got to be kidding me.

She tears it open. Inside: a single ticket. NORTHERN LINE. ONE WAY. Tomorrow's date.

And her name, handwritten.

INT. YARD OFFICE - CONTINUOUS

A space heater rattles. OTIS (60s, cardigan over a union jacket) nurses a thermos of coffee and a crossword.

Maya slaps the ticket on his desk.

MAYA
Who's been under car nine?

OTIS
Nobody's been under car nine since the Carter administration.

MAYA
Then explain this.

Otis studies it. Something passes over his face, recognition or maybe fear, and is gone.

OTIS
(too casual)
Kids. Pranks. Toss it.

MAYA
Kids don't know my middle name, Otis.

He doesn't answer. He folds his crossword. Very carefully.

INT. MAYA'S APARTMENT - KITCHEN - NIGHT

Dishes. Unopened bills. A photo on the fridge: Maya, younger, beside a WOMAN in a conductor's cap.

Maya props the ticket against the photo. Stares at both.

MAYA
You don't get to do this. Not after twenty years.

She picks up the phone. Dials. Waits.

INT. OTIS'S TRUCK - MOVING - NIGHT

Otis drives through snow. His phone buzzes. He answers.

OTIS
It's two in the morning.

MAYA (V.O.)
You knew her handwriting. Didn't you.

A long silence. Wipers thud.

OTIS
Get on the train, Maya.

He hangs up.

CUT TO:

EXT. NORTHERN LINE PLATFORM - DAWN

Maya, duffel over one shoulder, steps onto a train that shouldn't exist: brass fittings, velvet curtains, steam curling from its wheels.
`;

function sampleProject() {
  const r = parseFountain(SAMPLE_FOUNTAIN);
  const p = blankProject(r.title);
  Object.assign(p, { author: r.author, draftDate: r.draftDate, script: r.blocks, example: true, revision: 'Blue' });
  p.idea = {
    protagonist: 'Maya Reyes, a rail-yard mechanic who never left her hometown',
    incident: 'a one-way ticket in her vanished mother\'s handwriting turns up under a freight car',
    goal: 'board a train that shouldn\'t exist and find out what happened to her mother',
    antagonist: 'a yard boss who knows more than he says, and a train that doesn\'t want to let her off',
    stakes: 'she loses her last chance at the truth, and the life she never let herself live',
    hook: 'a train that only comes for the people who were left behind',
    logline1: 'When a one-way ticket in her vanished mother\'s handwriting turns up under a freight car, a rail-yard mechanic who never left home must ride a train that shouldn\'t exist to learn the truth, before it carries her past the point of return.',
    chosen: '1',
    genre: 'Supernatural drama', tone: 'Melancholy, mysterious, warm', comps: 'Field of Dreams meets Snowpiercer',
    theme: 'Is staying put an act of loyalty, or of fear?', controlling: 'We find our way home only when we stop waiting to be rescued.',
    cdq: 'Will Maya find out what happened to her mother?',
  };
  p.beats = {
    0: 'Maya walks the dead rail yard alone at night, tapping couplings. Dutiful, stuck, alone.',
    1: 'Otis: "Every train goes somewhere. You just have to decide if it\'s somewhere you want to be."',
    3: 'The ticket under car nine, in her mother\'s handwriting.',
    4: 'Maya confronts Otis, who tells her to toss it. The phone call: "Get on the train."',
    5: 'Maya boards the Northern Line at dawn.',
  };
  p.characters = [
    { id: uid(), name: 'Maya', role: 'Protagonist', age: '30s', want: 'To find out why her mother left', need: 'To stop living as if someone else will decide for her', flaw: 'Mistakes duty for love; never asks for help', arc: 'Keeps the lights on for everyone → chooses her own life', voice: 'Dry, clipped, deflects with jokes' },
    { id: uid(), name: 'Otis', role: 'Mentor', age: '60s', want: 'To keep a promise he made twenty years ago', need: 'To tell the truth even if it costs him Maya', flaw: 'Protects people by lying to them', voice: 'Folksy, circles around the point' },
  ];
  const scenes = p.script.filter((b) => b.t === 'scene');
  const cards = [
    ['Finish the night shift unnoticed', 'Something is taped under car nine', '-+'],
    ['Get Otis to explain the ticket', 'Otis deflects; he\'s hiding something', '+-'],
    ['Decide whether to believe it', 'Twenty years of anger at her mother', ''],
    ['Make Otis admit what he knows', 'He won\'t say it outright', '-+'],
    ['Board the train', '', ''],
  ];
  scenes.forEach((s, k) => { if (cards[k]) p.cards[s.id] = { goal: cards[k][0], conflict: cards[k][1], turn: cards[k][2] }; });
  p.ideas = [
    { id: uid(), text: 'Maya finds her mother\'s conductor cap in the dining car.' },
    { id: uid(), text: 'Every passenger is someone who never left their hometown.' },
  ];
  return p;
}

function renderRail() {

    story: P.mode === 'film' ? `${beatsDone}/15` : `${(P.tv.episodes || []).filter((e) => e && e.title).length} eps`,
    cast: P.characters.length || '',

  };
  $('#rail').innerHTML = VIEWS.map(([id, label]) => `<a href="#${id}" data-view="${id}" ${state.view === id ? 'aria-current="page"' : ''}>${label}<span class="meter">${meters[id] ?? ''}</span></a>`).join('')
    + `<div class="sep"></div><div class="hint">${P.mode === 'tv' ? (P.tvFormat === 'hour' ? 'One-hour TV' : 'Half-hour TV') : 'Feature film'} · ${esc(P.revision)} draft</div>`;

function toast(msg) {

function openMenu(anchor, html, bind) {

  bind(m);
  setTimeout(() => document.addEventListener('mousedown', closeMenuOutside), 0);
}
function closeMenuOutside(e) { if (!e.target.closest('#menu')) closeMenu(); }
function closeMenu() { const m = $('#menu'); if (m) m.remove(); document.removeEventListener('mousedown', closeMenuOutside); }

function projectsMenu(anchor) {
  const list = Object.values(LIB.projects).sort((a, b) => b.updated - a.updated);
  openMenu(anchor, `<small>Projects</small>${list.map((p) => `<button data-open="${p.id}">${p.id === P.id ? '● ' : ''}${esc(p.title || 'Untitled')}</button>`).join('')}
    <hr><button data-m="new-film">New feature film</button><button data-m="new-tv">New TV episode</button><button data-m="dup">Duplicate this project</button>
    <hr><button data-m="del" class="danger">Delete this project…</button>`, (m) => {
    m.addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.open) { closeMenu(); openProject(b.dataset.open); return; }
      const a = b.dataset.m;
      if (a === 'new-film' || a === 'new-tv') { closeMenu(); const p = blankProject('Untitled'); if (a === 'new-tv') { p.mode = 'tv'; p.script = [{ id: uid(), t: 'section', x: 'TEASER' }, { id: uid(), t: 'scene', x: '' }]; } addProject(p); navigate('home'); toast('New project created. Give it a title in Settings.'); }
      if (a === 'dup') { closeMenu(); const p = JSON.parse(JSON.stringify(P)); p.id = uid(); p.title = (P.title || 'Untitled') + ' (copy)'; delete p.example; addProject(p); toast('Duplicated.'); }
      if (a === 'del') {
        b.outerHTML = `<div class="confirm" style="padding:6px 10px">Delete “${esc(P.title)}”? <button class="btn small danger" data-m="del-yes">Delete</button><button class="btn small" data-m="del-no">Keep</button></div>`;
      }
      if (a === 'del-no') closeMenu();
      if (a === 'del-yes') {
        closeMenu();
        const id = P.id;
        delete LIB.projects[id];
        Store.removeRemote(id);
        if (!Object.keys(LIB.projects).length) addProject(blankProject('Untitled'), false);
        openProject(Object.keys(LIB.projects)[0]);
        Store.flush();
        toast('Project deleted.');
      }
    });
  });
}

function exportMenu(anchor) {
  openMenu(anchor, `<small>Export “${esc(P.title)}”</small>
    <button data-m="pdf">Screenplay PDF</button>
    <button data-m="fountain">Fountain file (plain text)</button>
    <button data-m="json">Project backup (everything)</button>
    ${inFrame ? '' : '<button data-m="print">Print…</button>'}
    <hr><button data-m="import">Import Fountain file or backup…</button>`, (m) => {
    m.addEventListener('click', (e) => {
      const a = e.target.closest('button')?.dataset.m; if (!a) return;
      closeMenu();
      if (a === 'pdf') exportPDF();
      if (a === 'fountain') saveFile(`${fileBase()}.${caps.downloads ? 'txt' : 'fountain'}`, toFountain(P), 'text/plain');
      if (a === 'json') saveFile(`${fileBase()} backup.json`, JSON.stringify(P, null, 1), 'application/json');
      if (a === 'print') printScript();
      if (a === 'import') $('#file-in').click();
    });
  });
}
function fileBase() { return (P.title || 'Untitled').replace(/[\\/:*?"<>|]+/g, '').trim() || 'Untitled'; }

async function saveFile(name, data, mime) {
  if (caps.downloads) {
    try { await caps.downloads.save({ filename: name, data }); toast(`Saved ${name}`); }
    catch (e) { if (e && e.code === 'declined') return; toast(e && e.code === 'rate_limited' ? 'A save is already waiting for you to confirm.' : 'That file couldn\'t be saved here.'); }
    return;
  }
  if (!inFrame) {
    const url = URL.createObjectURL(new Blob([data], { type: mime }));
    const a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast(`Saved ${name}`);
    return;
  }
  toast('Saving files isn\'t available in this view.');
}

function applyTheme(t) {
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
}

/* =====================================================================
   Routing and rendering
   ===================================================================== */
function navigate(view) {
  if (!VIEWS.some(([v]) => v === view)) view = 'home';
  if (location.hash !== '#' + view) history.replaceState(null, '', '#' + view);
  state.view = view;
  renderRail();
  renderView();
  refreshAssistant();
}

function renderView() {
  if (Editor.el) Editor.unmount();
  const main = $('#main');
  main.style.overflow = '';
  const v = Views[state.view];
  main.innerHTML = v.render();
  main.scrollTop = 0;
  if (v.after) v.after(main);
}

function tabs(view, list) {
  const cur = state.sub[view] || list[0][0];
  return `<div class="tabs" role="tablist">${list.map(([id, label]) => `<button role="tab" data-tab="${view}:${id}" aria-selected="${id === cur}">${label}</button>`).join('')}</div>`;
}
const subOf = (view, def) => state.sub[view] || def;

function field(k, label, opts = {}) {
  const v = getPath(P, k) ?? '';
  const hint = opts.hint ? `<em>${esc(opts.hint)}</em>` : '';
  const id = 'f-' + k.replace(/\W/g, '-');
  const control = opts.input
    ? `<input type="text" id="${id}" data-k="${k}" value="${esc(v)}" placeholder="${esc(opts.ph || '')}">`
    : `<textarea id="${id}" data-k="${k}" class="${opts.rows === 1 ? 'short' : ''}" rows="${opts.rows || 2}" placeholder="${esc(opts.ph || '')}">${esc(v)}</textarea>`;
  return `<label class="f" for="${id}"><span>${esc(label)}${hint}</span>${control}</label>`;
}

function nextStep(lay, beatsDone, target) {

  if (film && beatsDone < 6) return { title: 'Map your structure', why: `You've planned ${beatsDone} of 15 beats. Knowing your midpoint and ending makes the draft much faster.`, view: 'story', cta: 'Open the beat sheet' };
  if (!film && !(P.tv.engine || '').trim()) return { title: 'Define your series engine', why: 'What generates a new story every episode? Nail that before the pilot.', view: 'story', cta: 'Open the bible' };
  if (P.characters.length < 2) return { title: 'Build your cast', why: 'Give your hero and antagonist a want, a need and a flaw.', view: 'cast', cta: 'Go to Cast' };
  if (lay.scenes.length < 5 && lay.pageCount < 5) return { title: 'Plan your scenes', why: 'Sketch scenes as cards, give each a goal and a conflict, then put them in order.', view: 'scenes', cta: 'Open the scene board' };

    return { title: `Keep drafting: you're on page ${lay.pageCount}`, why: `You're in ${b.name} (${b.range}). ${b.desc}`, view: 'script', cta: 'Write' };

}

function tensionSVG(t) {
  const W = 900, H = 170, x0 = 20, x1 = W - 20, base = 120;
  const X = (p) => x0 + ((p - 1) / 109) * (x1 - x0);
  const pts = [[1, 10], [12, 18], [25, 40], [45, 46], [55, 64], [66, 54], [75, 28], [85, 48], [99, 92], [106, 78], [110, 44]];
  let d = `M ${X(pts[0][0])} ${base - pts[0][1]}`;
  for (let k = 1; k < pts.length; k++) { const [a, ya] = pts[k - 1], [b, yb] = pts[k]; const m = (X(a) + X(b)) / 2; d += ` C ${m} ${base - ya}, ${m} ${base - yb}, ${X(b)} ${base - yb}`; }
  const marks = [[1, '1'], [12, 'Catalyst'], [25, 'Act I break'], [55, 'Midpoint'], [75, 'All is lost'], [85, 'Act II break'], [99, 'Climax'], [110, String(t)]];
  return `<svg class="tension" viewBox="0 0 ${W} ${H}" role="img" aria-label="Story tension rising through the three acts">
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="3"/>
    <line x1="${x0}" x2="${x1}" y1="${base}" y2="${base}" stroke="var(--ink)" stroke-width="1.5"/>
    ${marks.map(([p, l]) => `<g><line x1="${X(p)}" x2="${X(p)}" y1="${base - 5}" y2="${base + 5}" stroke="var(--ink)"/><text x="${X(p)}" y="${base + 22}" text-anchor="${p === 1 ? 'start' : p === 110 ? 'end' : 'middle'}" font-size="13" fill="var(--ink)" font-family="Instrument Sans, sans-serif">${l}</text>${p > 1 && p < 110 ? `<text x="${X(p)}" y="${base + 40}" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="Instrument Sans, sans-serif">p. ${scale(p, t)}</text>` : ''}</g>`).join('')}
    <text x="${x0}" y="16" font-size="11" fill="var(--muted)" font-family="Instrument Sans, sans-serif" letter-spacing="1">TENSION</text></svg>`;
}

function sceneRanges() {
  const s = P.script;
  const starts = [];
  s.forEach((b, i) => { if (b.t === 'scene') starts.push(i); });
  return starts.map((st, k) => ({ start: st, end: (starts[k + 1] ?? s.length) - 1, block: s[st] }));
}
function moveScene(from, to) {
  const r = sceneRanges();
  if (to < 0 || to >= r.length || from === to) return;
  const chunk = P.script.slice(r[from].start, r[from].end + 1);
  P.script.splice(r[from].start, chunk.length);
  const r2 = sceneRanges();
  const at = to >= r2.length ? P.script.length : r2[to].start;
  P.script.splice(at, 0, ...chunk);
  layoutDirty = true;
  touch(true);
}

function pagesHTML(withTitle) {
  const lay = getLayout();
  const runHTML = (c) => {
    let html = '', k = 0;
    while (k < c.length) {
      let j = k; const st = c[k].slice(1).join();
      while (j < c.length && c[j].slice(1).join() === st) j++;
      let t = esc(c.slice(k, j).map((x) => x[0]).join(''));
      const [, b, it, u] = c[k];
      if (b) t = `<b>${t}</b>`; if (it) t = `<i>${t}</i>`; if (u) t = `<u>${t}</u>`;
      html += t; k = j;
    }
    return html;
  };
  let out = '';
  if (withTitle && (P.title || P.author)) {
    out += `<div class="pg title"><div class="ln" style="top:3.5in;text-align:center">${esc((P.title || 'Untitled').toUpperCase())}</div>
      <div class="ln" style="top:calc(3.5in + 36pt);text-align:center">Written by</div><div class="ln" style="top:calc(3.5in + 60pt);text-align:center">${esc(P.author || '')}</div>
      <div class="ln" style="left:1.5in;width:auto;top:calc(11in - 1.9in)">${esc([P.draftDate, P.contact].filter(Boolean).join('\n'))}</div></div>`;
  }
  lay.pages.forEach((page, n) => {
    out += `<div class="pg">${n ? `<div class="pn">${n + 1}.</div>` : ''}${page.map((ln) => {
      const top = `calc(1in + ${ln.row * 12}pt)`;
      const pos = ln.align === 'right' ? `right:${8.5 - RIGHT}in` : `left:${ln.x}in`;
      return `<div class="ln" style="top:${top};${pos}">${runHTML(ln.c)}</div>`;
    }).join('')}</div>`;
  });
  return out || '<div class="pg"></div>';
}

  const pages = $('#pages');

/* =====================================================================
   Export: PDF, print, import
   ===================================================================== */
function exportPDF() {
  const J = window.jspdf && window.jspdf.jsPDF;
  if (!J) { if (!inFrame) { printScript(); return; } toast('The PDF maker didn\'t load. Check your connection and try again.'); return; }
  const lay = getLayout();
  const doc = new J({ unit: 'pt', format: 'letter' });
  doc.setProperties({ title: P.title || 'Screenplay', author: P.author || '', creator: 'Draftroom' });
  const W = 612;
  const style = (b, i) => (b && i ? 'bolditalic' : b ? 'bold' : i ? 'italic' : 'normal');
  const draw = (c, x, y, align) => {
    const width = c.length * 7.2;
    if (align === 'right') x -= width;
    if (align === 'center') x -= width / 2;
    let k = 0;
    while (k < c.length) {
      let j = k; const st = c[k].slice(1).join();
      while (j < c.length && c[j].slice(1).join() === st) j++;
      const [, b, i, u] = c[k];
      const run = c.slice(k, j).map((q) => q[0]).join('');
      doc.setFont('courier', style(b, i));
      doc.text(run, x + k * 7.2, y);
      if (u) doc.line(x + k * 7.2, y + 1.5, x + j * 7.2, y + 1.5);
      k = j;
    }
  };
  doc.setFontSize(12);
  let first = true;
  if (P.title || P.author) {
    const center = (t, y) => draw(styled(t), W / 2, y, 'center');
    center((P.title || 'Untitled').toUpperCase(), 252);
    center('Written by', 288);
    center(P.author || '', 312);
    [P.draftDate, ...(P.contact || '').split('\n')].filter(Boolean).forEach((t, k) => draw(styled(t), 108, 648 + k * 12));
    doc.outline.add(null, 'Title page', { pageNumber: 1 });
    first = false;
  }
  const offset = first ? 0 : 1;
  lay.pages.forEach((page, n) => {
    if (!first || n) doc.addPage();
    if (n) { doc.setFont('courier', 'normal'); doc.text(`${n + 1}.`, RIGHT * 72, 36, { align: 'right' }); }
    for (const ln of page) draw(ln.c, ln.x * 72, 72 + ln.row * 12 + 9.6, ln.align);
  });
  for (const o of lay.outline) doc.outline.add(null, o.title, { pageNumber: o.page + offset });
  saveFile(`${fileBase()}.pdf`, doc.output('arraybuffer'), 'application/pdf');
}

function printScript() {
  $('#print-root').innerHTML = pagesHTML(true);
  window.print();
}

function importFile(file) {
  const r = new FileReader();
  r.onload = () => {
    const text = String(r.result || '');
    try {
      if (/\.json$/i.test(file.name)) {
        const p = JSON.parse(text);
        if (!p || !Array.isArray(p.script)) throw new Error('not a project');
        p.id = uid(); delete p.example;
        addProject(p); navigate('home'); toast(`Imported “${p.title || 'Untitled'}”.`);
      } else {
        const f = parseFountain(text);
        const p = blankProject(f.title || file.name.replace(/\.[^.]+$/, ''));
        Object.assign(p, { author: f.author, contact: f.contact, draftDate: f.draftDate, script: f.blocks.length ? f.blocks : p.script });
        f.blocks.forEach((b) => { if (b.t === 'scene' && b.syn) p.cards[b.id] = { goal: b.syn }; });
        addProject(p); navigate('script'); toast(`Imported ${plural(f.blocks.filter((b) => b.t === 'scene').length, 'scene')}.`);
      }
    } catch (e) { toast('That file couldn\'t be read. Import a .fountain, .txt or Draftroom backup (.json).'); }
  };
  r.readAsText(file);
}

function storyContext() {
  const i = P.idea;
  const lines = [
    `Project: "${P.title || 'Untitled'}" (${P.mode === 'film' ? `feature film, target ${P.targetPages} pages` : `${P.tvFormat} TV episode`}).`,
    chosenLogline() && `Logline: ${chosenLogline()}`,
    i.genre && `Genre: ${i.genre}. Tone: ${i.tone || 'n/a'}.`,
    i.theme && `Theme: ${i.theme}`,
    i.controlling && `Controlling idea: ${i.controlling}`,
    i.synopsis && `Synopsis: ${i.synopsis.slice(0, 1800)}`,
  ].filter(Boolean);
  if (P.mode === 'tv' && P.tv.engine) lines.push(`Series engine: ${P.tv.engine}`);
  if (P.characters.length) lines.push('Characters:\n' + P.characters.map((c) => `- ${c.name || 'Unnamed'} (${c.role || 'role n/a'}${c.age ? ', ' + c.age : ''}): wants ${c.want || '?'}; needs ${c.need || '?'}; flaw: ${c.flaw || '?'}`).join('\n'));
  const beats = BEATS.map((b, k) => (P.beats[k] ? `- ${b[0]}: ${P.beats[k]}` : '')).filter(Boolean);
  if (beats.length) lines.push('Planned beats:\n' + beats.join('\n'));

}
function sceneFountain(k) {
  const r = sceneRanges()[k];
  if (!r) return '';
  const tmp = { ...P, title: '', author: '', contact: '', draftDate: '', script: P.script.slice(r.start, r.end + 1) };
  return toFountain(tmp).split('\n').slice(3).join('\n').trim().slice(0, 7000);
}
function currentSceneIndex() {
  const c = Editor.el && Editor.caret();
  if (c) return sceneIndexAt(c.i);
  return Math.max(0, sceneRanges().length - 1);
}
function sceneContext() {
  const k = currentSceneIndex();
  const r = sceneRanges()[k];
  if (!r) return 'The writer has not started a scene yet.';
  const lay = getLayout();
  const page = lay.srcPage[r.start] || 1;
  const beat = currentBeat(P, page);
  const card = P.cards[r.block.id] || {};
  return `Current scene (scene ${k + 1}, page ${page}, beat: ${beat.name}):\n${card.goal ? `Scene goal: ${card.goal}\n` : ''}${card.conflict ? `Scene conflict: ${card.conflict}\n` : ''}\`\`\`\n${sceneFountain(k)}\n\`\`\``;
}
function firstPages(n) {
  const lay = getLayout();
  const upto = lay.srcPage.findIndex((p) => p > n);
  const tmp = { ...P, script: P.script.slice(0, upto < 0 ? P.script.length : upto) };
  return toFountain(tmp).slice(0, 14000);
}
