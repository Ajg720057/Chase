name: Build Meal Planner APK

on:
  push:
    paths:
      - "meal-planner-app/**"
      - ".github/workflows/meal-planner.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meal-planner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meal-planner-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MealPlanner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MealPlanner-apk
          path: meal-planner-app/MealPlanner.apk

      # A fixed release link you can open on your phone to download the latest build.
      - name: Publish to "Meal Planner (latest build)" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: meal-planner-latest
          name: Meal Planner (latest build)
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Latest Meal Planner build from `${{ github.ref_name }}` (${{ github.sha }}).
            On your Android phone, download **MealPlanner.apk** below and open it to install.
          files: meal-planner-app/MealPlanner.apk
