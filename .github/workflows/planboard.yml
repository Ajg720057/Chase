name: Build PlanBoard APK

on:
  push:
    paths:
      - "planboard-app/**"
      - ".github/workflows/planboard.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: planboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: planboard-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk PlanBoard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PlanBoard-apk
          path: planboard-app/PlanBoard.apk

      # A fixed release link you can open on your phone to download the latest build.
      - name: Publish to "PlanBoard (latest build)" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: planboard-latest
          name: PlanBoard (latest build)
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Latest PlanBoard build from `${{ github.ref_name }}` (${{ github.sha }}).
            On your Android phone, download **PlanBoard.apk** below and open it to install.
          files: planboard-app/PlanBoard.apk
