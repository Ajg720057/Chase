name: Build LifeBoard APK

on:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk LifeBoard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LifeBoard-apk
          path: android-app/LifeBoard.apk

      # A fixed release link you can open on your phone to download the latest build.
      - name: Publish to "LifeBoard (latest build)" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lifeboard-latest
          name: LifeBoard (latest build)
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Latest LifeBoard build from `${{ github.ref_name }}` (${{ github.sha }}).
            On your Android phone, download **LifeBoard.apk** below and open it to install.
          files: android-app/LifeBoard.apk
